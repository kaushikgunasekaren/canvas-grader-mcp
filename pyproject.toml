[project]
name = "canvas-grader-mcp"
version = "0.4.0"
description = "MCP server that helps teachers and TAs grade Canvas LMS submissions and leave SpeedGrader feedback"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kaushik Gunasekaren" }]
requires-python = ">=3.10"
keywords = ["mcp", "canvas", "lms", "grading", "speedgrader", "education"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Intended Audience :: Education",
]
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
    "python-docx>=1.1",
    "pypdfium2>=5.14.0",
    "pillow>=12.3.0",
    "zxing-cpp>=3.1.1",
    "imageio-ffmpeg>=0.6.0",
]

[project.scripts]
canvas-grader-mcp = "canvas_grader_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
